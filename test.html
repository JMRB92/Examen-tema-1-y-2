<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pruebas EXAMEN TEST v1.01</title><link rel="stylesheet" href="css/styles.css"></head><body><header><div class="brand"><span class="mark">✓</span><div><strong>Pruebas funcionales</strong><small>EXAMEN TEST v1.01</small></div></div></header><main><section class="panel"><h1 class="hero">Verificación automática</h1><p>Comprueba la integridad del banco, la mezcla independiente y la fórmula de puntuación sin completar el examen.</p><button class="primary" id="run">Ejecutar pruebas</button><div id="out"></div><p><a href="index.html">Volver a la aplicación</a></p></section></main><script src="js/questions-embedded.js"></script><script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#out');out.innerHTML='';const add=(name,ok)=>out.innerHTML+=`<p class="${ok?'correct':'incorrect'}">${ok?'✓':'✗'} ${name}</p>`;try{let q=window.EXAM_QUESTIONS;if(location.protocol!=='file:'){try{const r=await fetch('data/questions.json');if(r.ok)q=await r.json()}catch{}}add('Hay exactamente 50 preguntas',q.length===50);add('Identificadores únicos',new Set(q.map(x=>x.id)).size===50);add('Cuatro opciones por pregunta',q.every(x=>x.options.length===4));add('Respuestas correctas válidas',q.every(x=>x.options.some(o=>o.id===x.correctOptionId)));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let order=shuffle(q.map(x=>x.id));add('La mezcla conserva las 50 preguntas',new Set(order).size===50);add('La mezcla conserva las opciones y su respuesta correcta',q.every(x=>{const ids=shuffle(x.options.map(o=>o.id));return ids.length===4&&ids.includes(x.correctOptionId)}));const grade=(c,w)=>Math.max(0,Math.min(10,Math.round((c*.2-w*.05)*100)/100));add('50 aciertos = 10',grade(50,0)===10);add('40 aciertos y 10 errores = 7,50',grade(40,10)===7.5);add('30 aciertos y 10 errores = 5,50',grade(30,10)===5.5);add('50 errores = 0',grade(0,50)===0)}catch(e){add('Carga del banco: '+e.message,false)}};document.querySelector('#run').click()</script></body></html>
